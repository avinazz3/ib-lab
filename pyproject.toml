[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ib-lab"
version = "0.2.0"
description = "Explainable momentum research and read-only IBKR tools using ib_async"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ib_async==2.1.0",
  "exchange-calendars>=4.11,<5",
  "pyarrow>=17,<24",
  "ta-lib>=0.6.5,<0.7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "filelock>=3.16,<4",
  "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
ib-lab = "ib_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ib_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
